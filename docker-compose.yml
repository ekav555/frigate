services:
  frigate:
    container_name: frigate
    image: ghcr.io/blakeblackshear/frigate:stable
    restart: unless-stopped
    privileged: true
    shm_size: "256mb"
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    volumes:
      - ./config:/config
      - /mnt/frigate-storage:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    ports:
      # - "5000:5000" # Internal unauthenticated port -- DO NOT expose
      - "8971:8971"   # Authenticated UI and API
      - "8554:8554"   # RTSP restream
      - "8555:8555/tcp" # WebRTC over TCP
      - "8555:8555/udp" # WebRTC over UDP
    environment:
      FRIGATE_RTSP_PASSWORD: "${FRIGATE_RTSP_PASSWORD:-password}"

  # Water meter via RTL-SDR (USB passed into this LXC)
  # Replaces the custom HA Water Meter Monitor add-on + host rtl_tcp
  rtlamr2mqtt:
    container_name: rtlamr2mqtt
    image: allangood/rtlamr2mqtt:latest
    restart: unless-stopped
    devices:
      - /dev/bus/usb:/dev/bus/usb
    volumes:
      - ./rtlamr2mqtt.yaml:/etc/rtlamr2mqtt.yaml:ro
    # Privileged helps with USB claim after host rtl_tcp leftovers
    privileged: true
