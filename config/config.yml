# =============================================================
# Frigate NVR Configuration (repo template)
# =============================================================
# Live secrets stay on the LXC (/opt/frigate/config/config.yml).
# Use {FRIGATE_RTSP_PASSWORD} / MQTT placeholders here.
# Docs: https://docs.frigate.video/configuration/
# Session notes: ../SESSION-2026-08-16.md
# =============================================================

mqtt:
  enabled: true
  host: 192.168.68.120
  port: 1883
  user: mqtt-user
  password: "{MQTT_PASSWORD}"

detectors:
  cpu1:
    type: cpu
    num_threads: 2

ffmpeg:
  hwaccel_args: preset-vaapi

# go2rtc restreams: detect stays on H.264 sub; live/record use main.
# Without this, Frigate live falls back to jsmpeg of the 640p detect feed.
go2rtc:
  streams:
    front_porch_left:
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.68.124:554/h265Preview_01_main
      - "ffmpeg:front_porch_left#audio=opus"
    front_porch_left_sub:
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.68.124:554/h264Preview_01_sub
    front_porch_right:
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.68.YYY:554/h265Preview_01_main
      - "ffmpeg:front_porch_right#audio=opus"
    front_porch_right_sub:
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.68.YYY:554/h264Preview_01_sub
    drive_way:
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.68.XXX:554/h265Preview_01_main
      - "ffmpeg:drive_way#audio=opus"
    drive_way_sub:
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.68.XXX:554/h264Preview_01_sub

record:
  enabled: true
  retain:
    days: 3
    mode: motion
  events:
    retain:
      default: 14
      mode: active_objects

snapshots:
  enabled: true
  retain:
    default: 14

objects:
  track:
    - person
    - car
    - dog
    - cat
  filters:
    person:
      min_area: 5000
      threshold: 0.7
    car:
      min_area: 10000
      threshold: 0.7

# -------------------------------------------------------
# Cameras
# Detect = H.264 sub (Broadwell-safe). Record + live = main.
# In Frigate UI, pick "Main" on the live player if it defaults to Sub.
# -------------------------------------------------------

cameras:
  front_porch_left:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/front_porch_left_sub
          input_args: preset-rtsp-restream
          roles:
            - detect
        - path: rtsp://127.0.0.1:8554/front_porch_left
          input_args: preset-rtsp-restream
          roles:
            - record
            - audio
    audio:
      enabled: true
    detect:
      width: 640
      height: 360
      fps: 5
    live:
      streams:
        Main: front_porch_left
        Sub: front_porch_left_sub
    objects:
      track:
        - person
        - car
        - dog
        - cat

  front_porch_right:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/front_porch_right_sub
          input_args: preset-rtsp-restream
          roles:
            - detect
        - path: rtsp://127.0.0.1:8554/front_porch_right
          input_args: preset-rtsp-restream
          roles:
            - record
            - audio
    audio:
      enabled: true
    detect:
      width: 640
      height: 360
      fps: 5
    live:
      streams:
        Main: front_porch_right
        Sub: front_porch_right_sub
    objects:
      track:
        - person
        - car
        - dog
        - cat

  drive_way:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/drive_way_sub
          input_args: preset-rtsp-restream
          roles:
            - detect
        - path: rtsp://127.0.0.1:8554/drive_way
          input_args: preset-rtsp-restream
          roles:
            - record
            - audio
    audio:
      enabled: true
    detect:
      width: 640
      height: 360
      fps: 5
    live:
      streams:
        Main: drive_way
        Sub: drive_way_sub
    objects:
      track:
        - person
        - car
        - dog
        - cat

ui:
  live_mode: mse
  timezone: America/New_York
