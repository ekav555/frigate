# =============================================================
# Frigate NVR — full tracked config (0.17)
# =============================================================
# Secrets via Docker env (see ../.env.example), NOT inline passwords.
#   FRIGATE_RTSP_PASSWORD  — Reolink admin password
#   FRIGATE_MQTT_PASSWORD  — Mosquitto password
# Live copy on LXC: /opt/frigate/config/config.yml
# Docs: https://docs.frigate.video/configuration/
# =============================================================

mqtt:
  enabled: true
  host: 192.168.68.120
  port: 1883
  user: mqtt-user
  password: "{FRIGATE_MQTT_PASSWORD}"

detectors:
  cpu1:
    type: cpu
    num_threads: 2

ffmpeg:
  hwaccel_args: preset-vaapi

# Recording / snapshots (Frigate 0.17 schema)
record:
  enabled: true
  alerts:
    retain:
      days: 14
  detections:
    retain:
      days: 14
  continuous:
    days: 0
  motion:
    days: 3

snapshots:
  enabled: true
  retain:
    default: 14

# Object AI — required for bounding boxes + HA occupancy
# Loose filters first; tighten after Debug shows boxes.
objects:
  track:
    - person
    - car
    - dog
    - cat
  filters:
    person:
      min_area: 1200
      threshold: 0.55
    dog:
      min_area: 800
      threshold: 0.5
    cat:
      min_area: 600
      threshold: 0.5
    car:
      min_area: 4000
      threshold: 0.6

# -------------------------------------------------------
# Cameras (3× Reolink)
# Detect = H.264 sub @ 640x360. Record/audio = H.265 main.
# All cameras stay enabled.
# -------------------------------------------------------

cameras:
  front_porch_left:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.68.112:554/h264Preview_01_sub
          roles:
            - detect
        - path: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.68.112:554/h265Preview_01_main
          roles:
            - record
            - audio
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 5
    audio:
      enabled: true

  front_porch_right:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.68.125:554/h264Preview_01_sub
          roles:
            - detect
        - path: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.68.125:554/h265Preview_01_main
          roles:
            - record
            - audio
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 5
    audio:
      enabled: true

  drive_way:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.68.111:554/h264Preview_01_sub
          roles:
            - detect
        - path: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.68.111:554/h265Preview_01_main
          roles:
            - record
            - audio
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 5
    audio:
      enabled: true

ui:
  timezone: America/New_York
