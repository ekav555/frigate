# =============================================================
# Frigate NVR — full tracked config (0.17)
# =============================================================
# Secrets via Docker env (see ../.env.example), NOT inline passwords.
#   FRIGATE_RTSP_PASSWORD  — Reolink admin password
#   FRIGATE_MQTT_PASSWORD  — Mosquitto password
# Live copy on LXC: /opt/frigate/config/config.yml
# Docs: https://docs.frigate.video/configuration/
# =============================================================

mqtt:
  enabled: true
  host: 192.168.68.120
  port: 1883
  user: mqtt-user
  password: "{FRIGATE_MQTT_PASSWORD}"

detectors:
  cpu1:
    type: cpu
    # i7-8750H: driveway LPR at 1280x720 needs more CPU
    num_threads: 6

# Intel UHD 630 (host renderD129 → container renderD128). Detect streams are H.264.
# H.265 record may use CPU decode; fine for 3 cams on this CPU.
ffmpeg:
  hwaccel_args: preset-intel-qsv-h264

# Recording / snapshots (Frigate 0.17 schema)
record:
  enabled: true
  alerts:
    retain:
      days: 14
  detections:
    retain:
      days: 14
  continuous:
    days: 0
  motion:
    days: 3

snapshots:
  enabled: true
  retain:
    default: 14

# Object AI — required for bounding boxes + HA occupancy
# Loose filters first; tighten after Debug shows boxes.
# Do NOT add license_plate to track unless using a Frigate+ model.
objects:
  track:
    - person
    - car
    - dog
    - cat
  filters:
    person:
      min_area: 1200
      threshold: 0.55
    dog:
      min_area: 800
      threshold: 0.5
    cat:
      min_area: 600
      threshold: 0.5
    car:
      min_area: 4000
      threshold: 0.6

# Review UI — keep empty so tracked objects (HA occupancy, LPR) do NOT
# create Review alerts/detections. Add labels here only if you want them
# in the Review timeline (e.g. person).
review:
  alerts:
    labels: []
  detections:
    labels: []

# Built-in LPR (no Frigate+ required). Runs on the *detect* stream only.
# Docs: https://docs.frigate.video/configuration/license_plate_recognition/
# 640x360 is too small for plates — driveway detect must be >= 1280x720.
lpr:
  enabled: true
  device: CPU
  detection_threshold: 0.6
  recognition_threshold: 0.7
  min_area: 500
  # Allow 1-character OCR typos when matching known plates
  match_distance: 1
  # Save cropped plate images under /media/frigate/clips/lpr/ for debugging
  debug_save_plates: true
  # When this plate is read, Frigate sets sub_label on the car.
  # HA Frigate integration exposes a sensor for known plates (reload
  # the Frigate integration after applying).
  known_plates:
    gray_suv:
      - "NDG4216"
      - "NDG-4216"
    # PA test plate on stand — place in front of a *car* Frigate already tracks
    test_stand:
      - "KLL5428"
      - "KLL-5428"
      - "KLL 5428"

# -------------------------------------------------------
# Cameras (3× Reolink)
# Porch: H.264 sub @ 640x360. Driveway: raise camera sub to 1280x720
# (or 1920x1080) in Reolink UI, then match detect width/height below.
# LPR only on driveway.
# -------------------------------------------------------

cameras:
  front_porch_left:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.68.112:554/h264Preview_01_sub
          roles:
            - detect
        - path: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.68.112:554/h265Preview_01_main
          roles:
            - record
            - audio
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 5
    audio:
      enabled: true
    lpr:
      enabled: false

  front_porch_right:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.68.123:554/h264Preview_01_sub
          roles:
            - detect
        - path: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.68.123:554/h265Preview_01_main
          roles:
            - record
            - audio
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 5
    audio:
      enabled: true
    lpr:
      enabled: false

  drive_way:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.68.111:554/h264Preview_01_sub
          roles:
            - detect
        - path: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.68.111:554/h265Preview_01_main
          roles:
            - record
            - audio
    detect:
      enabled: true
      # MUST match Reolink sub-stream resolution (set in camera UI first)
      width: 1280
      height: 720
      fps: 7
    audio:
      enabled: true
    lpr:
      enabled: true
      min_area: 500

  side_yard:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.68.82:554/h264Preview_01_sub
          roles:
            - detect
        - path: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.68.82:554/h265Preview_01_main
          roles:
            - record
            - audio
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 5
    audio:
      enabled: true
    lpr:
      enabled: false

ui:
  timezone: America/New_York

# Verbose LPR logs while tuning the stand / driveway (set back to info later)
logger:
  default: info
  logs:
    frigate.data_processing.common.license_plate: debug
