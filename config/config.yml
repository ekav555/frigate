# =============================================================
# Frigate NVR — full tracked config (0.17)
# =============================================================
# Secrets via Docker env (see ../.env.example), NOT inline passwords.
#   FRIGATE_RTSP_PASSWORD  — Reolink admin password
#   FRIGATE_MQTT_PASSWORD  — Mosquitto password
# Live copy on LXC: /opt/frigate/config/config.yml
# Host: HP ZBook Studio G5 (i7-8750H / UHD 630 / 32GB) @ 192.168.68.40
# LXC 101: 10 cores / 8GB — OpenVINO GPU detect (~15% CPU @ 4 cams)
# Docs: https://docs.frigate.video/configuration/
# =============================================================

mqtt:
  enabled: true
  host: 192.168.68.120
  port: 1883
  user: mqtt-user
  password: "{FRIGATE_MQTT_PASSWORD}"

# Object detection on Intel UHD 630 via OpenVINO (NOT the CPU detector).
# CPU detector pegged ~86% of 10 cores; OpenVINO GPU ~8ms / ~15% system CPU.
# Docs: https://docs.frigate.video/configuration/object_detectors/
detectors:
  ov:
    type: openvino
    device: GPU

model:
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt

# Intel UHD 630 (host renderD129 → container renderD128). Detect = H.264 + QSV.
# Record stays stream-copy. OpenVINO also uses this iGPU for detection.
ffmpeg:
  hwaccel_args: preset-intel-qsv-h264

# Recording — WD ~1.8TB @ /media/frigate (motion/events only; continuous=0).
# 30-day alerts/detections/motion is OK for motion-only; watch System → Storage
# and `df -h /mnt/frigate-storage` when stressing 6 cams.
record:
  enabled: true
  alerts:
    retain:
      days: 30
  detections:
    retain:
      days: 30
  continuous:
    days: 0
  motion:
    days: 30

snapshots:
  enabled: true
  retain:
    default: 30

# Object AI — required for bounding boxes + HA occupancy
# Loose filters first; tighten after Debug shows boxes.
# Do NOT add license_plate to track unless using a Frigate+ model.
objects:
  track:
    - person
    - car
    - dog
    - cat
  filters:
    person:
      min_area: 1200
      threshold: 0.55
    dog:
      min_area: 800
      threshold: 0.5
    cat:
      min_area: 600
      threshold: 0.5
    car:
      min_area: 4000
      threshold: 0.6

# Review UI — keep empty so tracked objects (HA occupancy, LPR) do NOT
# create Review alerts/detections. Add labels here only if you want them
# in the Review timeline (e.g. person).
review:
  alerts:
    labels: []
  detections:
    labels: []

# LPR on driveway only (global on; other cams disable below).
# Docs: https://docs.frigate.video/configuration/license_plate_recognition/
# Driveway detect must stay >= 1280x720 for usable plates.
lpr:
  enabled: true
  device: GPU
  detection_threshold: 0.6
  recognition_threshold: 0.7
  min_area: 500
  match_distance: 1
  debug_save_plates: false
  known_plates:
    gray_suv:
      - "NDG4216"
      - "NDG-4216"
    test_stand:
      - "KLL5428"
      - "KLL-5428"
      - "KLL 5428"

# -------------------------------------------------------
# Cameras (7× Reolink)
# Porch + side + backyard_*: H.264 sub @ 640x360. Driveway: 1280x720 for LPR.
# LPR only on driveway. Backyard names are temporary.
# -------------------------------------------------------

cameras:
  front_porch_left:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.68.112:554/h264Preview_01_sub
          roles:
            - detect
        - path: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.68.112:554/h265Preview_01_main
          roles:
            - record
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 5
    audio:
      enabled: false
    lpr:
      enabled: false

  front_porch_right:
