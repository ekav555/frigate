# =============================================================
# Frigate NVR Configuration (repo template)
# =============================================================
# Live secrets stay on the LXC (/opt/frigate/config/config.yml).
# Use {FRIGATE_RTSP_PASSWORD} / MQTT placeholders here.
# Docs: https://docs.frigate.video/configuration/
# Session notes: ../SESSION-2026-08-16.md
# =============================================================

mqtt:
  enabled: true
  host: 192.168.68.120
  port: 1883
  user: mqtt-user
  password: "{MQTT_PASSWORD}"

detectors:
  cpu1:
    type: cpu
    num_threads: 2

ffmpeg:
  hwaccel_args: preset-vaapi

record:
  enabled: true
  retain:
    days: 3
    mode: motion
  events:
    retain:
      default: 14
      mode: active_objects

snapshots:
  enabled: true
  retain:
    default: 14

objects:
  track:
    - person
    - car
    - dog
    - cat
  filters:
    person:
      min_area: 5000
      threshold: 0.7
    car:
      min_area: 10000
      threshold: 0.7

# -------------------------------------------------------
# Cameras (as of 2026-08-16)
# Reolink: detect = H.264 sub, record = H.265 main + audio
# Amcrest: Extra (subtype=1) MUST be H.264 for Broadwell VAAPI
# -------------------------------------------------------

cameras:
  front_door:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.68.124:554/h264Preview_01_sub
          roles:
            - detect
        - path: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.68.124:554/h265Preview_01_main
          roles:
            - record
            - audio
    audio:
      enabled: true
    detect:
      width: 640
      height: 360
      fps: 5
    objects:
      track:
        - person
        - car
        - dog
        - cat

  back_yard:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.68.XXX:554/h264Preview_01_sub
          roles:
            - detect
        - path: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.68.XXX:554/h265Preview_01_main
          roles:
            - record
            - audio
    audio:
      enabled: true
    detect:
      width: 640
      height: 360
      fps: 5
    objects:
      track:
        - person
        - car
        - dog
        - cat

  garden_view:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.68.75:554/cam/realmonitor?channel=1&subtype=1
          roles:
            - detect
        - path: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.68.75:554/cam/realmonitor?channel=1&subtype=0
          roles:
            - record
    detect:
      width: 640
      height: 480
      fps: 5
    objects:
      track:
        - person
        - car
        - dog
        - cat

ui:
  live_mode: mse
  timezone: America/New_York
